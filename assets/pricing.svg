<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Independent official and gateway pricing: illustrated sample configuration"><title>Independent official and gateway pricing: illustrated sample configuration</title><rect width="1200" height="760" fill="#eef2f7"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="15" fill="#4168d4" font-weight="700">ROUTE-SPECIFIC PRICING</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="34" fill="#1c283a" font-weight="700">One model name does not mean one price.</text><text x="48" y="148" font-family="Arial, sans-serif" font-size="18" fill="#64748b" font-weight="400">Choose the billing rules for the endpoint you actually use.</text><rect x="48" y="193" width="520" height="358" rx="14" fill="#fff" stroke="#dce2ec"/><text x="72" y="237" font-family="Arial, sans-serif" font-size="25" fill="#1c283a" font-weight="600">Official endpoint</text><text x="72" y="268" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">api.deepseek.com</text><rect x="72" y="290" width="472" height="42" rx="8" fill="#eaf0fc" stroke="#eaf0fc"/><text x="87" y="317" font-family="Arial, sans-serif" font-size="17" fill="#3458b2" font-weight="600">Official tariff estimate</text><text x="72" y="371" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Currency</text><text x="270" y="371" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">USD</text><text x="72" y="416" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Tariff</text><text x="270" y="416" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Peak / off-peak</text><text x="72" y="461" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Source</text><text x="270" y="461" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Verified price snapshot</text><text x="72" y="506" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Unknown model</text><text x="270" y="506" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Usage only</text><rect x="632" y="193" width="520" height="358" rx="14" fill="#fff" stroke="#dce2ec"/><text x="656" y="237" font-family="Arial, sans-serif" font-size="25" fill="#1c283a" font-weight="600">Your gateway</text><text x="656" y="268" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">gateway.example</text><rect x="656" y="290" width="472" height="42" rx="8" fill="#eaf0fc" stroke="#eaf0fc"/><text x="671" y="317" font-family="Arial, sans-serif" font-size="17" fill="#3458b2" font-weight="600">Custom price estimate</text><text x="656" y="371" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Currency</text><text x="854" y="371" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">CNY or USD</text><text x="656" y="416" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Input / 1M</text><text x="854" y="416" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Set your rate</text><text x="656" y="461" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Output / 1M</text><text x="854" y="461" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Set your rate</text><text x="656" y="506" font-family="Arial, sans-serif" font-size="16" fill="#64748b" font-weight="400">Cache / 1M</text><text x="854" y="506" font-family="Arial, sans-serif" font-size="16" fill="#1c283a" font-weight="400">Separate read / write</text><rect x="48" y="575" width="1104" height="105" rx="14" fill="#e6edf8" stroke="#e6edf8"/><text x="73" y="611" font-family="Arial, sans-serif" font-size="21" fill="#1c283a" font-weight="600">Group reports when you choose. Preserve the original rates on each call.</text><text x="73" y="648" font-family="Arial, sans-serif" font-size="17" fill="#52647d" font-weight="400">Estimates are not balances or invoices. Reference prices and display FX are not live feeds.</text><text x="48" y="733" font-family="Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400">ILLUSTRATED DEMO • Configuration examples, not vendor quotes.</text></svg>